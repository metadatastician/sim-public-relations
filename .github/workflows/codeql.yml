# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: CodeQL Security Analysis
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 1 * *'   # monthly 1st 06:00 UTC (Actions burn cut, standards#288)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Default to `actions` — scaffolded repos rarely have JS/TS
          # source; `javascript-typescript` produced "no source files"
          # failures on every CodeQL run. The `actions` extractor scans
          # workflow files which every repo has. Override per-repo if
          # the scaffolded project actually contains JS/TS code.
          # Per hypatia rule `codeql_language_matrix_mismatch`.
          - language: actions
            build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      # v4.38.0, deliberately. v4.38.1 (1c5b6756) is refused by GitHub at
      # workflow startup — tag AND SHA form — across the whole estate
      # (hyperpolymath/nexia-list#100; standards pins the same 4.38.0 SHA).
      # A grouped Dependabot bump to 4.38.1 is what killed this workflow on
      # main (#28). dependabot.yml ignores that version; Lock Sync Gate blocks
      # any bump that lands without a matching actions.lock update.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
