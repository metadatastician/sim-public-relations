# This workflow is managed by gh actions-lock.
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read      # required by the reusable workflow (staleness check reads workflow runs)
  contents: read

jobs:
  scorecard:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@bd9313a6fca4a08b4f0f0763f0079f6a24262726
    # Reusable called-workflow permissions are CAPPED by the caller's grants;
    # without security-events: write here the scorecard SARIF upload fails with
    # startup_failure (hypatia WF018). id-token: write enables OIDC publish.
    # actions: read is required by Scorecard's Packaging check — a job-level
    # block REPLACES the top-level one, so it must be repeated here (the
    # reusable's own header says so; 11 of 13 estate callers had omitted it).
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
